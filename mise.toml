[tools]
node = "24"

[tasks.setup]
run = "npm ci"
outputs = ["node_modules/"]
sources = ["package.json", "package-lock.json"]

[tasks.start]
run = "npm run dev"
depends = ["setup"]

[tasks.build]
run = "npm run build"
depends = ["setup"]

[tasks.format]
run = "npm run format"
depends = ["setup"]

[tasks.lint]
run = "npm run lint"
depends = ["setup"]